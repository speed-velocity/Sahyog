name: sahyog

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      SAHYOG_MIGRATOR_PASSWORD: ${SAHYOG_MIGRATOR_PASSWORD:?Set SAHYOG_MIGRATOR_PASSWORD in the root .env file}
      SAHYOG_APP_PASSWORD: ${SAHYOG_APP_PASSWORD:?Set SAHYOG_APP_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in the root .env file}:5432"
    volumes:
      - sahyog-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  sahyog-postgres-data:
    name: sahyog-postgres-data
