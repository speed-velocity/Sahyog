[project]
name = "sahyog-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.16,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
migrations = [
    "alembic>=1.20,<1.21",
]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[tool.uv]
# The backend runs from the workspace and is not installed as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "integration: requires the isolated PostgreSQL sahyog_test database",
]

[tool.ruff]
target-version = "py312"
