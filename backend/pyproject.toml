[project]
name = "sahyog-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.16,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.3,<3.4",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.4.2",
    "python-multipart>=0.0.34",
]

[dependency-groups]
migrations = [
    "alembic>=1.20,<1.21",
]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[tool.uv]
# The backend source/package structure has not been created yet.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/core/auth.py" = ["B008"]
# These files are the published Role 1 detector implementation. Keep the
# backend integration lint strict without rewriting its approved source.
"app/services/anomaly.py" = ["TRY004", "UP006", "UP035", "UP045"]
"app/services/anomaly_integration.py" = ["UP006", "UP035", "UP037", "UP045"]
"app/services/detector_backend_contract.py" = ["I001", "RUF022", "UP045"]
